[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whospeaks"
version = "0.1.0.dev23"
description = "Local speaker diarization and realtime voice-labeling tools."
readme = "README.md"
license = "MIT"
license-files = [
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "vendor/RealtimeSTT/LICENSE",
    "vendor/RealtimeSTT_server/LICENSE",
    "vendor/stream2sentence/LICENSE",
    "src/window/assets/flags/LICENSE",
]
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8,<7",
]

[project.urls]
Homepage = "https://github.com/KoljaB/WhoSpeaksLive"
Repository = "https://github.com/KoljaB/WhoSpeaksLive"
Documentation = "https://github.com/KoljaB/WhoSpeaksLive/tree/master/docs"

