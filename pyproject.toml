[project.scripts]
whospeaks = "whospeaks_cli.main:main"
whospeaks-gui = "whospeaks_gui.main:main"
whospeaks-window = "window.youtube_window_diarize_gui:main"
whospeaks-realtime = "realtime.realtime_speakerdiarize:main"
whospeaks-filefeed-replay = "replay.youtube_local_filefeed_replay:main"
whospeaks-embedding-benchmark = "embeddings.benchmark_voice_embeddings:main"
whospeaks-browser-live-eval = "window.browser_live_speaker_eval:main"
whospeaks-meeting-intelligence = "window.meeting_intelligence_server:main"
whospeaks-translation-server = "window.translation_server:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src", "vendor"]
namespaces = false

[tool.setuptools.package-data]
whospeaks_gui = ["assets/*.svg"]
remote_servers = [
    "faster-whisper-asr/asr_server.py",
    "faster-whisper-asr/mlx_asr_server.py",
    "faster-whisper-asr/requirements.txt",
    "voice-embeddings-server/embeddings_server.py",
    "voice-embeddings-server/requirements-macos.txt",
    "voice-embeddings-server/requirements.txt",
    "voice-embeddings-server/speechbrain_compat.py",
]
stream2sentence = ["data/*.json", "LICENSE"]
RealtimeSTT = ["assets/**/*", "LICENSE"]
RealtimeSTT_server = ["LICENSE"]
window = [
    "assets/flags/LICENSE",
    "assets/flags/README.md",
    "assets/flags/4x3/*.svg",
    "assets/web/**/*.html",
    "assets/web/**/*.css",
    "assets/web/**/*.js",
    "report_template_presets/*.json",
]
